  --c-oil:#c58b00; --c-coolant:#0e9fb8; --c-brakes:#d24b4b; --c-tires:#4a5568; --c-plugs:#7c4ddb; --c-battery:#1f9d55; --c-fuel:#2f6df6;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme=light]){
  --bg:#0c111b; --surface:#151c29; --surface-2:#1d2636; --text:#e9edf5; --muted:#97a1b5; --line:#263043;
  --accent:#6c9bff; --accent-2:#2fd3c1; --accent-soft:#1b2a4a; --on-accent:#0b1020;
  --ok:#3ccf8a; --ok-soft:#123323; --soon:#f2b04a; --soon-soft:#3a2a10; --over:#ff6b6b; --over-soft:#3d1717; --none:#8892a6; --none-soft:#222b3b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
  --c-tires:#a0aec0;
}}
:root[data-theme=dark]{
  --bg:#0c111b; --surface:#151c29; --surface-2:#1d2636; --text:#e9edf5; --muted:#97a1b5; --line:#263043;
  --accent:#6c9bff; --accent-2:#2fd3c1; --accent-soft:#1b2a4a; --on-accent:#0b1020;
  --ok:#3ccf8a; --ok-soft:#123323; --soon:#f2b04a; --soon-soft:#3a2a10; --over:#ff6b6b; --over-soft:#3d1717; --none:#8892a6; --none-soft:#222b3b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
  --c-tires:#a0aec0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
a{color:var(--accent);text-decoration:none}
h2,h3{margin:0;line-height:1.2}
h2{font-size:1.45rem;letter-spacing:-.01em}
h3{font-size:1.05rem;display:flex;align-items:center;gap:8px}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}
.muted{color:var(--muted)}
small{font-size:.82rem}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.1rem;letter-spacing:-.01em}
.logo{width:32px;height:32px;flex:none;border-radius:9px;background:#060a18 var(--logo) center/cover no-repeat;box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.08)}
.vswitch{display:flex;align-items:center;gap:6px;min-height:40px;max-width:60vw;padding:6px 12px 6px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font:inherit;font-weight:600;font-size:.92rem;cursor:pointer}
.vswitch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{max-width:720px;margin:0 auto;padding:6px 14px 24px;outline:none}
.page-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 4px 12px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;font-weight:600}

/* cards */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.card > h3{margin-bottom:12px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-head h3{margin:0}
.hero{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 14%,var(--surface)),var(--surface) 60%)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats.two{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 10px 9px;min-width:0}
.stat .k{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-size:1.18rem;font-weight:750;letter-spacing:-.01em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font-size:.72rem;font-weight:600;color:var(--muted);margin-left:2px}
.row-actions{display:flex;gap:10px;margin-top:14px}
.row-actions .btn{flex:1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:10px 16px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font:inherit;font-weight:650;cursor:pointer;text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn.danger{background:var(--over);border-color:transparent;color:#fff}
.btn.ghost-danger{color:var(--over);border-color:color-mix(in srgb,var(--over) 40%,var(--line))}
.btn.block{width:100%}
.btn.small{min-height:40px;padding:6px 12px;font-size:.9rem;border-radius:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.chip-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;white-space:nowrap}
.link{display:inline-block;margin-top:10px;font-weight:650;min-height:32px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}

/* status */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:.76rem;font-weight:750;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--ok-soft)}
.pill.soon{color:var(--soon);background:var(--soon-soft)}
.pill.over{color:var(--over);background:var(--over-soft)}
.pill.none{color:var(--none);background:var(--none-soft)}
.status-summary{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 10px}
.status-list{display:flex;flex-direction:column}
.srow{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 2px;color:var(--text);border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.sicon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.sbody{flex:1;min-width:0;display:flex;flex-direction:column}
.sbody b{font-weight:650}
.sbody small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.c-oil{--c:var(--c-oil)}.c-coolant{--c:var(--c-coolant)}.c-brakes{--c:var(--c-brakes)}.c-tires{--c:var(--c-tires)}.c-plugs{--c:var(--c-plugs)}.c-battery{--c:var(--c-battery)}.c-fuel{--c:var(--c-fuel)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--text);min-height:132px}
.tile b{font-size:1rem}
.tile small{color:var(--muted);flex:1}
.tile .pill{align-self:flex-start}

/* insights */
.insights{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.insights li{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:var(--r-sm);background:var(--surface-2);font-size:.95rem}
.insights li::before{content:"";flex:none;width:8px;height:8px;margin-top:7px;border-radius:50%;background:var(--accent)}
.insights li.good::before{background:var(--ok)}
.insights li.warn::before{background:var(--soon)}
.insights-note{margin-top:10px;font-size:.78rem;color:var(--muted)}
.spark{color:var(--accent)}

/* entries */
.list{display:flex;flex-direction:column;gap:8px}
.entry{display:flex;gap:12px;align-items:stretch;width:100%;text-align:left;padding:12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;cursor:pointer;min-height:64px}
.entry.dim{opacity:.55}
.e-main{flex:1;min-width:0}
.e-main b{font-weight:650}
.e-sub{color:var(--muted);font-size:.86rem;margin-top:2px}
.e-side{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:2px;text-align:right;white-space:nowrap}
.e-side b{font-weight:700}
.e-side small{color:var(--muted)}
.mpg{font-weight:750;color:var(--accent);font-size:.9rem}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:.72rem;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.good{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--soon-soft);color:var(--soon)}
.tag.accent{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty .big{font-size:1.15rem;font-weight:700;color:var(--text);margin:10px 0 6px}
.empty .btn-row{justify-content:center;margin-top:16px}
.hero-empty{display:grid;place-items:center;width:72px;height:72px;margin:0 auto;border-radius:22px;background:#060a18 var(--logo) center/cover no-repeat;box-shadow:var(--shadow)}
.hero-empty .ic{width:36px;height:36px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--text);margin-bottom:14px;font-size:.9rem}

/* compare table */
.cmp{width:100%;border-collapse:collapse;font-size:.92rem}
.cmp th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:right;font-weight:650;padding:4px 6px}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp td{padding:9px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.cmp td.barcell{width:36%;}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.cmp-wrap + .cmp-wrap{margin-top:16px}
.cmp-title{font-weight:700;font-size:.9rem;margin-bottom:4px}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* spec card */
.spec{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:.92rem}
.spec div span{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:650}
.spec .wide{grid-column:1/-1}
.tire4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.tire4 span{background:var(--surface-2);border-radius:8px;padding:6px 8px;font-size:.85rem;text-align:center}

/* vehicles */
.vcard{display:flex;align-items:center;gap:12px}
.vcard .vinfo{flex:1;min-width:0}
.vcard .vinfo b{display:block;font-size:1.05rem}
.vcard .vinfo small{color:var(--muted)}
.vactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.current-badge{font-size:.72rem;font-weight:750;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:999px}
.setting{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.setting:first-of-type{border-top:0;padding-top:0}
.setting > b{font-weight:650}
.setting > small{color:var(--muted)}

/* fab + tabbar */
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:25;width:60px;height:60px;border-radius:20px;border:0;background:var(--accent);color:var(--on-accent);
  box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 45%,transparent);display:grid;place-items:center;cursor:pointer}
.fab .ic{width:28px;height:28px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;border-radius:14px;color:var(--muted);font-size:.74rem;font-weight:650}
.tabbar a.on{color:var(--accent);background:var(--accent-soft)}

/* dialogs */
dialog{border:0;padding:0;color:var(--text);background:transparent}
dialog::backdrop{background:rgba(6,10,20,.5);backdrop-filter:blur(2px)}
.sheet{width:100%;max-width:640px;max-height:92vh;margin:auto auto 0;border-radius:24px 24px 0 0;background:var(--surface);overflow:hidden}
@media (min-width:700px){.sheet{margin:auto;border-radius:24px;max-height:88vh}}
.sheet-inner{display:flex;flex-direction:column;max-height:92vh;margin:0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-head h3{font-size:1.1rem}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:var(--surface-2);color:var(--text);display:grid;place-items:center;cursor:pointer}
.sheet-body{overflow:auto;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-foot .btn{flex:1}
.confirm{width:min(92vw,420px);border-radius:22px;background:var(--surface);margin:auto}
.confirm-inner{padding:20px}
.confirm-inner h3{margin-bottom:8px}
.confirm-inner p{margin:0 0 14px;color:var(--muted)}
.confirm-inner .btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}

/* form fields */
.field{flex:1 1 100%;display:flex;flex-direction:column;gap:6px;min-width:0}
.field.half{flex:1 1 calc(50% - 6px)}
.field[hidden]{display:none}
.field > .lbl{font-size:.8rem;font-weight:650;color:var(--muted)}
.fhead{flex:1 1 100%;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-top:8px}
.hint{flex:1 1 100%;font-size:.82rem;color:var(--muted);margin-top:-4px}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;min-height:var(--tap);padding:10px 12px;width:100%;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px;border-color:var(--accent)}
input[type=date]{min-width:0}
.unit{position:relative;display:flex;align-items:center}
.unit input{padding-right:52px}
.unit em{position:absolute;right:12px;font-style:normal;font-size:.82rem;color:var(--muted);pointer-events:none}
.unit.pre input{padding-left:28px;padding-right:12px}
.unit.pre em{left:12px;right:auto}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{flex:1 0 auto}
.seg input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:650;font-size:.9rem;cursor:pointer;white-space:nowrap}
.seg input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:var(--tap);padding:8px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer;font-weight:600}
.toggle input{width:50px;height:30px;min-height:0;border-radius:99px;padding:0;position:relative;background:var(--line);border:0;flex:none;cursor:pointer;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.toggle input:checked{background:var(--ok)}
.toggle input:checked::after{transform:translateX(20px)}
.toggle small{display:block;color:var(--muted);font-weight:500}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quad label{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;color:var(--muted)}
.quad label b{width:26px}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:100;
  background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:.92rem;transition:.2s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:560px){ .stats{grid-template-columns:repeat(3,1fr)} .tiles{grid-template-columns:repeat(3,1fr)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* rewards */
.search{display:flex;align-items:center;gap:8px;padding:0 12px;margin-bottom:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.search input{border:0;background:transparent;padding-left:0;outline:none}
.search:focus-within{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);border-color:var(--accent)}
a.entry{text-decoration:none}
.entry[hidden]{display:none}
.rw-list{display:flex;flex-direction:column;gap:8px}
.rw{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);overflow:hidden}
.rw.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.rw-head{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;cursor:pointer}
.rw-head input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.rw-check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none;background:var(--surface)}
.rw-check .ic{width:16px;height:16px;stroke-width:3}
.rw.on .rw-check{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.rw-head input:focus-visible + .rw-check{outline:2px solid var(--accent);outline-offset:2px}
.rw-name{flex:1;font-weight:650}
.rw-head small{color:var(--muted)}
.rw-fields{display:none;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px 12px}
.rw.on .rw-fields{display:grid}
.rw-fields label{display:flex;flex-direction:column;gap:4px;font-size:.74rem;font-weight:650;color:var(--muted)}
.rw-fields input{min-height:44px;padding:8px 10px}
.seg label,.rw-head{position:relative}
.seg input,.rw-head input{left:0;top:0}
.sheet-body{overflow-x:hidden}
.rw-fields{grid-template-columns:repeat(3,minmax(0,1fr))}
.quad{grid-template-columns:repeat(2,minmax(0,1fr))}
.rw-fields input,.quad input,.field input{min-width:0}
.sheet{max-width:min(640px,100vw)}
.sheet-inner,.sheet-body{min-width:0;max-width:100%}
.cmp td:first-child{white-space:normal;word-break:break-word}
.cmp th,.cmp td{padding-left:4px;padding-right:4px}
/* v2 */
.top-right{display:flex;align-items:center;gap:8px;min-width:0}
.bell{position:relative;width:44px;height:44px;border-radius:999px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--text);flex:none}
.bell-count{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--over);color:#fff;font-size:.72rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.bell-count[hidden]{display:none}
.vswitch{max-width:46vw}
.update-bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));z-index:60;border:0;border-radius:999px;padding:12px 20px;min-height:48px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:750;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer;white-space:nowrap}
.update-bar[hidden]{display:none}
.banner.over{background:var(--over-soft)} .banner.soon{background:var(--soon-soft)}
.banner .icon-btn{width:36px;height:36px;background:transparent}
.hero-links{display:flex;gap:16px;margin-top:12px;font-weight:650;font-size:.92rem}
.hero-links a{display:inline-flex;align-items:center;gap:6px;min-height:36px}
.hero-links .ic{width:18px;height:18px}
.vinrow{display:flex;gap:8px}
.vinrow input{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase}
.vinrow .btn{flex:none;min-height:var(--tap)}
.vinmsg{display:block;font-size:.82rem}
.vinmsg.good{color:var(--ok)} .vinmsg.bad{color:var(--over)}
.field.autofill input{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--surface-2))}
.warnbox{flex:1 1 100%;display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:var(--soon-soft);color:var(--soon);font-weight:600;font-size:.9rem}
.warnbox[hidden]{display:none}
.specgrp{padding:14px 0;border-top:1px solid var(--line)}
.specgrp:first-of-type{border-top:0}
.where{margin-top:10px;font-size:.88rem}
.where summary{cursor:pointer;color:var(--accent);font-weight:650;min-height:32px;display:flex;align-items:center}
.where p{margin:6px 0;color:var(--muted)}
.where a{display:inline-flex;align-items:center;gap:6px;font-weight:600;word-break:break-word}
.where a .ic{width:16px;height:16px}
.entry.rem{cursor:default;align-items:flex-start}
.fab[hidden]{display:none}
/* sync */
.card.sync .sync-lead{margin:0 0 12px}
.sync-form{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.sync-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sync-row > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.sync-row b{overflow-wrap:anywhere}
.sync-err{padding:10px 12px;border-radius:12px;background:var(--over-soft);color:var(--over);font-weight:600;font-size:.9rem}
.sync-tip{padding:12px;border-radius:12px;background:var(--surface-2);font-size:.88rem;margin-bottom:12px;color:var(--muted)}
.sync-tip b{color:var(--text)}
.sync-note{font-size:.84rem;margin:12px 0 0}

/* ===== v6: parts, inventory, planner, stats, TCO dashboard, overview ===== */
:root{--c-air:#5a8f29}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--c-air:#8cc95a}}
:root[data-theme=dark]{--c-air:#8cc95a}
.c-airFilter,.c-cabinFilter{--c:var(--c-air)}.c-inventory{--c:var(--accent)}
.tabbar{grid-template-columns:repeat(6,1fr)}
.tabbar a{font-size:.68rem}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-weight:650;padding:0 2px;cursor:pointer}
/* fitment on forms */
.fitbox{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px}
.fit-head{display:flex;align-items:center;gap:8px;font-size:.86rem}.fit-head .ic{width:18px;height:18px;color:var(--accent)}.fit-head b{flex:1}
.fitgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;margin-top:6px}
.fitcell span{display:block;font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:650}
.fitcell b{font-size:.95rem}.fitcell.big{grid-column:1/-1}.fitcell.big b{font-size:1.7rem;letter-spacing:-.02em}
.fit-suggest{margin-top:8px;font-size:.84rem;line-height:1.4}.fit-suggest small{display:block;color:var(--muted);margin-top:4px}.fit-suggest.warn{color:var(--soon)}
.fit-edit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px;align-items:end}
.fe{display:flex;flex-direction:column;gap:3px;font-size:.74rem;color:var(--muted);font-weight:650;min-width:0}.fe.wide{grid-column:1/-1}
.fe input{font:inherit;font-size:.95rem;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);min-width:0;width:100%;box-sizing:border-box}
/* pickers */
.pick{display:flex;flex-direction:column;gap:8px}
.pick-ui{display:flex;flex-direction:column;gap:8px}
.pick-q{font:inherit;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);width:100%;box-sizing:border-box}
.pick-row{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:8px}
.pick-row select{font:inherit;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);min-width:0;width:100%}
.pick-all{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.pick-results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pick-results button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;cursor:pointer}
.pick-results button:last-child{border-bottom:0}.pick-results small{color:var(--muted);font-size:.76rem}.good{color:var(--ok)}.warn{color:var(--soon)}
.pick-info{display:flex;flex-direction:column;gap:5px;font-size:.86rem}.pick-info:empty{display:none}
.pi-fit{font-size:.8rem;font-weight:650}.pi-fit.good{color:var(--ok)}.pi-fit.warn{color:var(--soon)}
.pi-price{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.pi-plan{background:var(--accent-soft);border-radius:10px;padding:7px 10px;font-size:.84rem}.pi-plan.good{background:var(--ok-soft)}
.offers{display:flex;flex-wrap:wrap;gap:6px}.offers a{font-size:.8rem;padding:4px 9px;border-radius:999px;background:var(--surface-2)}
.pick-inv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.84rem}.pick-inv small{color:var(--muted);width:100%}
.pnote,.padd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:end}.padd .fhead,.padd small{grid-column:1/-1}
/* service quick links */
.quick-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.ql{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);color:var(--text)}
.ql .ic{width:22px;height:22px;color:var(--accent);margin-bottom:4px}.ql small{color:var(--muted);font-size:.78rem}
.seg.scope{margin-bottom:12px}
.entry.plan{align-items:flex-start}
/* dashboard: TCO hero in the headlight-on-navy brand */
.tco-hero{position:relative;overflow:hidden;border-radius:24px;padding:18px 16px 16px;margin-bottom:14px;color:#eef3ff;
  background:radial-gradient(120% 70% at 18% -10%,rgba(190,215,255,.30),transparent 55%),radial-gradient(90% 60% at 95% -5%,rgba(150,190,255,.22),transparent 60%),linear-gradient(160deg,#0f1d44 0%,#0b1430 55%,#060a18 100%);
  box-shadow:0 14px 40px rgba(6,10,24,.35)}
.tco-hero::after{content:"";position:absolute;left:-10%;right:-10%;top:-60px;height:120px;background:radial-gradient(closest-side,rgba(255,255,255,.18),transparent);pointer-events:none}
.tco-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tco-hero .eyebrow{color:#a9bce6}.tco-hero h2{color:#fff;margin:2px 0 0}
.tco-label{margin-top:14px;font-size:.78rem;color:#a9bce6;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.tco-big{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;line-height:1.05;text-shadow:0 0 24px rgba(170,200,255,.35)}
.tco-rates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.tco-rates div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:8px 10px}
.tco-rates b{display:block;font-size:1.05rem;color:#fff}.tco-rates span{font-size:.72rem;color:#a9bce6}
.tco-break{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center;margin-top:14px}
.donut{width:120px;height:120px}
.tco-legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:.84rem}
.tco-legend li{display:grid;grid-template-columns:10px minmax(0,1fr) auto 34px;gap:7px;align-items:center}
.tco-legend i{width:10px;height:10px;border-radius:3px}.tco-legend span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d6e0f7}.tco-legend small{color:#a9bce6;text-align:right}
.tco-hero .qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.tco-hero .qa .btn{justify-content:center;padding-left:6px;padding-right:6px;font-size:.84rem}
.tco-hero .qa .btn:not(.primary){background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff}
.tco-hero .qa .btn.primary{background:#f4f7ff;color:#0b1430;box-shadow:0 0 18px rgba(200,220,255,.45)}
.tco-hero .chip-btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.15)}
.seg.tiny{flex-wrap:nowrap;gap:4px}.seg.tiny span{padding:5px 10px;font-size:.78rem}
.tco-hero .seg.tiny span{background:rgba(255,255,255,.08);color:#d6e0f7;border-color:rgba(255,255,255,.12)}
.tco-hero .seg.tiny input:checked+span{background:#f4f7ff;color:#0b1430}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.kpi{background:var(--surface);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);color:var(--text);min-width:0}
.kpi span{display:block;font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{font-size:1.15rem;letter-spacing:-.01em}.kpi.over b{color:var(--over)}.kpi.soon b{color:var(--soon)}
.proj-total{font-size:1.25rem}
.proj-split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.proj-split div{background:var(--surface-2);border-radius:12px;padding:8px 10px}.proj-split span{display:block;font-size:.74rem;color:var(--muted)}
.proj-list{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:6px;font-size:.86rem}.proj-list li{display:flex;justify-content:space-between;gap:10px}
.chart text{font-size:9.5px;fill:var(--muted)}
.legend.col{flex-direction:column;align-items:flex-start;gap:4px}
/* vehicle overview */
.ov-head code{font-size:.82rem;letter-spacing:.04em}
.diag-card{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:10px;align-items:center}
.cardiag{width:100%;max-width:230px;margin:0 auto;display:block}
.cardiag .body{fill:color-mix(in srgb,var(--accent) 10%,var(--surface-2));stroke:var(--line);stroke-width:2}
.cardiag .glass{fill:color-mix(in srgb,var(--accent) 22%,var(--surface));opacity:.8}
.cardiag text{font-size:10px;fill:var(--muted);font-weight:700}.cardiag .zl{font-size:9px;letter-spacing:.1em}
.zone rect{fill:var(--none-soft);stroke:var(--line);stroke-width:1.5;transition:filter .15s}
.zone.ok rect{fill:color-mix(in srgb,var(--ok) 30%,transparent);stroke:var(--ok)}.zone.soon rect{fill:color-mix(in srgb,var(--soon) 35%,transparent);stroke:var(--soon)}.zone.over rect{fill:color-mix(in srgb,var(--over) 35%,transparent);stroke:var(--over)}
.zone:hover rect,.zone:focus rect{filter:brightness(1.15)}
.comps{display:flex;flex-direction:column;gap:2px}
.comp{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);color:var(--text)}.comp:first-child{border-top:0}
.comp-main{display:flex;flex-direction:column;gap:2px;min-width:0}.comp-main small{font-size:.78rem;color:var(--muted)}
.life{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:5px 0 2px;max-width:220px}.life i{display:block;height:100%;border-radius:99px;background:var(--ok)}.life i.soon{background:var(--soon)}.life i.over{background:var(--over)}
/* stats */
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.stats-t td,.stats-t th{white-space:nowrap}
.conf{font-size:.7rem;font-weight:750;padding:3px 8px;border-radius:999px;white-space:nowrap}
.conf.high{background:var(--ok-soft);color:var(--ok)}.conf.med{background:var(--accent-soft);color:var(--accent)}.conf.low{background:var(--soon-soft);color:var(--soon)}.conf.none{background:var(--none-soft);color:var(--none)}
.dd-block{padding:10px 0;border-top:1px solid var(--line)}.dd-block:first-of-type{border-top:0;padding-top:0}
.dd-nums{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--muted)}.dd-nums b{color:var(--text)}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:110px}
.mo{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}.mo-bar{flex:1;width:100%;display:flex;align-items:flex-end}.mo-bar i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--accent),var(--accent-2))}.mo small{font-size:.66rem;color:var(--muted)}
td.good b{color:var(--ok)}td.warn b{color:var(--soon)}
/* static fitment cards */
.fit-static .fs-big span{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.fit-static .fs-big b{font-size:2rem;letter-spacing:-.02em}.fit-static .fs-big small{display:block;color:var(--muted);font-size:.78rem}
.fit-static.missing .fs-big b{font-size:1.1rem}
.fs-rest{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;margin-top:6px;font-size:.84rem}.fs-rest span{display:block;font-size:.7rem;color:var(--muted)}
.fit-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fit-cards>div{background:var(--surface-2);border-radius:var(--r-sm);padding:10px;min-width:0}
.fc-t{display:flex;gap:6px;align-items:center;font-size:.8rem;font-weight:700;margin-bottom:4px}.fc-t .ic{width:16px;height:16px;color:var(--accent)}
.fit-cards .fit-static .fs-big b{font-size:1.4rem}
.seg.tiny span{min-height:32px}
.fit-edit[hidden],.pick [hidden],.pick-results[hidden]{display:none!important}
.pick-all{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}.pick-all input[type=checkbox]{width:20px;height:20px;min-height:0;flex:0 0 20px;padding:0;margin:0;accent-color:var(--accent);appearance:auto;-webkit-appearance:checkbox;background:none;border:0}
.pick-inv{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.pick-inv .chip-btn{max-width:100%;white-space:normal;text-align:left;overflow-wrap:anywhere}
.fitcard b,.fitcard .fv,.fit-grid b,.fitbox b{overflow-wrap:anywhere;word-break:break-word}.entry .tags .tag{white-space:normal;max-width:100%;overflow-wrap:anywhere}.fit-grid>div,.fitcard>div{min-width:0}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
.stats-t{font-size:.86rem;width:100%}
.stats-t th,.stats-t td{padding:8px 4px;white-space:nowrap}
.stats-t td:first-child{white-space:normal;min-width:96px}
@media (max-width:440px){.stats-t th:nth-child(3),.stats-t td:nth-child(3){display:none}}

.tco-hero>*{position:relative}
/* launch splash */
.rz-splash{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:radial-gradient(80% 55% at 50% 38%,#0f1a33 0%,#05070d 70%);color:#cfd6e4;cursor:pointer;
  opacity:1;transition:opacity .35s ease}
.rz-splash.out{opacity:0;pointer-events:none}
.rz-in{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px}
.rz-in img{width:min(58vw,236px);height:auto;filter:drop-shadow(0 10px 30px rgba(40,90,200,.25))}
.rz-presents{margin:18px 0 0;font-size:.78rem;letter-spacing:.32em;text-transform:uppercase;color:#aeb8cc;font-weight:700}
.rz-presents b{color:#e8edf6;font-weight:800}
.rz-app{margin:8px 0 0;font-size:1.55rem;font-weight:800;letter-spacing:.02em;color:#f3f6fb}
.rz-app::after{content:"";display:block;width:56px;height:3px;margin:10px auto 0;border-radius:2px;background:linear-gradient(90deg,#1d4fbf,#3b7bff,#1d4fbf)}
.rz-skip{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:.75rem;color:#6f7a90;letter-spacing:.08em}
@media (prefers-reduced-motion:no-preference){
  .rz-in img{animation:rzForge .7s cubic-bezier(.2,.8,.2,1) both}
  .rz-presents{animation:rzUp .5s .25s ease both}.rz-app{animation:rzUp .5s .4s ease both}
}
@media (prefers-reduced-motion:reduce){.rz-splash{transition:none}}
@keyframes rzForge{from{opacity:0;transform:scale(.92);filter:brightness(1.8) drop-shadow(0 0 0 rgba(40,90,200,0))}to{opacity:1;transform:none}}
@keyframes rzUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* About */
.rz-about{text-align:center;padding:26px 18px 22px;color:#dfe5f0;border:0;
  background:radial-gradient(90% 60% at 50% 0%,rgba(59,123,255,.18),transparent 65%),linear-gradient(170deg,#0e1424 0%,#070a12 100%);box-shadow:0 14px 40px rgba(6,10,24,.3)}
.rz-about img{width:min(60vw,220px);height:auto}
.rz-about .rz-ch{margin:16px 0 0;font-size:.74rem;letter-spacing:.3em;text-transform:uppercase;color:#9fb0cf;font-weight:700}
.rz-about h2{margin:6px 0 0;color:#fff;font-size:1.5rem}
.rz-about .rz-alias{margin:2px 0 0;color:#c3cad8;font-style:italic}
.rz-about p.rz-copy{margin:14px auto 0;max-width:30em;color:#aab4c6;font-size:.92rem}
.rz-sign{display:inline-block;margin-top:18px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:1rem;color:#e9eef7;
  background:linear-gradient(180deg,#f4f6fa,#9aa3b2);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.rz-sign::after{content:"";display:block;height:3px;margin-top:6px;border-radius:2px;background:linear-gradient(90deg,transparent,#2a62e0 20%,#3b7bff 50%,#2a62e0 80%,transparent)}
.rz-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px;text-align:left}
.rz-meta div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:9px 11px}
.rz-meta span{display:block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:#8d9ab3;font-weight:700}
.rz-meta b{color:#eef2f8;font-size:.92rem}
/* branded footer (Garage, About) */
.rz-foot{display:flex;flex-direction:column;align-items:center;gap:4px;margin:18px auto 6px;color:var(--muted);text-decoration:none;font-size:.78rem;text-align:center}
.rz-foot img{width:26px;height:30px;border-radius:3px;opacity:.9}
.rz-foot b{letter-spacing:.18em;text-transform:uppercase;font-size:.7rem;color:var(--text);opacity:.8}
.rz-foot i{font-style:normal;letter-spacing:.06em}
.join-coach{border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);background:linear-gradient(160deg,var(--accent-soft),var(--surface) 70%)}.join-coach p{margin:6px 0 0}

:root[data-theme=dark]{--c-chain:#d1ad6a;--c-cvt:#f08a5d;--c-gear:#d4c25a;--c-lower:#41c2cf;--c-imp:#62a9ee;--c-fsep:#e27ab0;--c-anode:#aab2bf;--c-trailer:#93a4c4;--c-winter:#8cc4f5;--c-custom:#a3abbb}
.c-chain{--c:var(--c-chain)}.c-cvt{--c:var(--c-cvt)}.c-gearOil{--c:var(--c-gear)}.c-lowerUnit{--c:var(--c-lower)}.c-impeller{--c:var(--c-imp)}.c-fuelSep{--c:var(--c-fsep)}.c-anodes{--c:var(--c-anode)}.c-trailer{--c:var(--c-trailer)}.c-winterize{--c:var(--c-winter)}.c-custom{--c:var(--c-custom)}
/* RIZNOSS-style type badges: navy plate, steel-blue line art */
[class*="c-vt-"]{--c:#3b7bff}
.sicon[class*="c-vt-"]{background:linear-gradient(160deg,#0f1a33,#05070d);color:#8fb3ff;box-shadow:inset 0 0 0 1px rgba(120,160,255,.28),0 1px 3px rgba(0,0,0,.25)}
.vt-filter{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;scrollbar-width:none}
.vt-filter::-webkit-scrollbar{display:none}
.vt-filter{position:relative}.vt-filter label{flex:none;position:relative}.vt-filter input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.vt-filter span{display:flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.84rem;white-space:nowrap;cursor:pointer}
.vt-filter span .ic{width:20px;height:20px}.vt-filter small{color:var(--muted);font-weight:700}
.vt-filter input:checked+span{background:linear-gradient(160deg,#0f1a33,#122554);border-color:#2c4f9e;color:#e8edf6}.vt-filter input:checked+span small{color:#9fb6e6}
.vt-filter input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.vt-group{display:flex;align-items:center;gap:10px;margin:16px 2px 8px}
.vt-group h3{margin:0;font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.vt-group .vt-ic{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:linear-gradient(160deg,#0f1a33,#05070d);color:#8fb3ff;box-shadow:inset 0 0 0 1px rgba(120,160,255,.28)}
.vt-group .vt-ic .ic{width:18px;height:18px}
.vt-rule{flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,#1d4fbf,transparent)}
.add-type{margin:4px 0 14px}
.quad.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tire4.two{grid-template-columns:repeat(2,1fr)}
.cardiag.wide{max-width:300px}
.zone circle,.zone path{fill:var(--none-soft);stroke:var(--line);stroke-width:1.5;transition:filter .15s}
.zone.ok circle{fill:color-mix(in srgb,var(--ok) 30%,transparent);stroke:var(--ok)}.zone.soon circle{fill:color-mix(in srgb,var(--soon) 35%,transparent);stroke:var(--soon)}.zone.over circle{fill:color-mix(in srgb,var(--over) 35%,transparent);stroke:var(--over)}
.zone:hover circle,.zone:focus circle{filter:brightness(1.15)}
.cardiag .frame{fill:none;stroke:var(--muted);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.55}.cardiag .frame.thin{stroke-width:2;opacity:.35}
.tco-rates.four{grid-template-columns:repeat(4,minmax(0,1fr))}

const rws = e => Array.isArray(e.rewards) ? e.rewards : [];
const rwSaved = (r, e) => ((num(r.cpg) || 0) * (num(e.gallons) || 0) / 100) + (num(r.saved) || 0);
const fillCpg = e => (num(e.centsOff) || 0) + rws(e).reduce((t, r) => t + (num(r.cpg) || 0), 0);
const fillSaved = e => ((num(e.centsOff) || 0) * (num(e.gallons) || 0) / 100) + (num(e.saved) || 0) + rws(e).reduce((t, r) => t + rwSaved(r, e), 0);
const fillPoints = e => (num(e.points) || 0) + rws(e).reduce((t, r) => t + (num(r.points) || 0), 0);
/* rewards programs */
const progById = id => db.programs.find(x => x.id === id) || null;
const progLib = pr => pr && pr.libId ? libById(pr.libId) : null;
const progName = pr => pr ? (pr.name || progLib(pr)?.name || 'Program') : 'Removed program';
const rwName = r => progById(r.pid) ? progName(progById(r.pid)) : (r.name || 'Removed program');
function progStats(pid) {
  let saved = 0, points = 0, fills = 0, gal = 0;
  db.vehicles.forEach(v => v.fuel.forEach(e => rws(e).forEach(r => { if (r.pid === pid) { saved += rwSaved(r, e); points += num(r.points) || 0; fills++; gal += num(e.gallons) || 0; } })));
  return { saved, points, fills, gal };
}

function fuelStats(v) {
  const from = v.fuelStatsFrom;
  const all = [...v.fuel].sort((a, b) => (num(a.odo) - num(b.odo)) || (a.date || '').localeCompare(b.date || ''));
  const fills = from != null ? all.filter(e => num(e.odo) > from) : all;
  const segs = []; let base = null, gal = 0, cost = 0, partialsUsed = 0, pend = 0, restarts = 0;
  const mpgById = {};
  for (const e of fills) {
    const g = num(e.gallons) || 0;
    if (e.missed && base) restarts++;
    if (e.missed || !base) { base = e.full ? e : null; gal = 0; cost = 0; pend = 0; continue; }
    gal += g; cost += fillTotal(e) - fillSaved(e);
    if (!e.full) { pend++; continue; }
    const miles = num(e.odo) - num(base.odo);
    if (miles > 0 && gal > 0) {
      const s = { from: base, to: e, miles, gal, cost, mpg: miles / gal };
      segs.push(s); mpgById[e.id] = s.mpg; partialsUsed += pend;
    }
    base = e; gal = 0; cost = 0; pend = 0;
  }
  const r = { fills, all, segs, mpgById, partialsUsed, restarts };
  r.totalSpent = sum(fills, fillTotal); r.totalGal = sum(fills, 'gallons');
  r.totalSaved = sum(fills, fillSaved); r.points = sum(fills, fillPoints);
  const bp = new Map();
  fills.forEach(e => rws(e).forEach(r => { const g = bp.get(r.pid) || { pid: r.pid, label: rwName(r), saved: 0, points: 0, fills: 0 }; g.saved += rwSaved(r, e); g.points += num(r.points) || 0; g.fills++; bp.set(r.pid, g); }));
  r.byProgram = [...bp.values()].sort((a, b) => b.saved - a.saved || b.points - a.points);
  r.avgPrice = r.totalGal ? sum(fills, e => (num(e.price) || 0) * (num(e.gallons) || 0)) / r.totalGal : null;
  r.effPrice = r.totalGal ? (r.totalSpent - r.totalSaved) / r.totalGal : null;
  const sm = sum(segs, 'miles'), sg = sum(segs, 'gal');
  r.segMiles = sm; r.avgMpg = sg ? sm / sg : null;
  r.best = segs.reduce((b, s) => !b || s.mpg > b.mpg ? s : b, null);
  r.worst = segs.reduce((b, s) => !b || s.mpg < b.mpg ? s : b, null);
  r.lastMpg = segs.length ? segs[segs.length - 1].mpg : null;
  r.cpm = sm ? sum(segs, 'cost') / sm : null;
  r.tank = num(v.tank) || (fills.length ? Math.max(...fills.map(e => num(e.gallons) || 0)) : null);
  r.range = r.avgMpg && r.tank ? r.avgMpg * r.tank : null;
  if (fills.length >= 2) {
    const f0 = fills[0], f1 = fills[fills.length - 1];
    r.milesTracked = num(f1.odo) - num(f0.odo);
    r.spanDays = daysBetween(f0.date, f1.date);
    r.milesPerDay = r.spanDays > 0 ? r.milesTracked / r.spanDays : null;
  }
  // MPG of each tank is credited to the fuel that was burned: the grade of the fill that started the segment.
  const group = keyFn => {
    const m = new Map();
    segs.forEach(s => { const k = keyFn(s.from); if (k == null) return; const g = m.get(k) || { label: k, segs: 0, miles: 0, gal: 0, cost: 0 }; g.segs++; g.miles += s.miles; g.gal += s.gal; g.cost += s.gal * ((num(s.from.price) || 0) - fillCpg(s.from) / 100); m.set(k, g); });
    return [...m.values()].map(g => ({ ...g, mpg: g.miles / g.gal, cpm: g.cost / g.miles })).sort((a, b) => b.mpg - a.mpg);
  };
  r.byEth = group(e => ethLabel(e) === '—' ? null : ethLabel(e));
  r.byOct = group(e => octVal(e) != null ? `${octVal(e)} octane` : null);
  return r;
}

function insights(v, s) {
  const out = [];
  if (!s.fills.length) return [{ t: 'Log your first fill-up to get started. Filling the tank all the way each time gives the most accurate MPG.' }];
  if (!s.segs.length) return [{ t: 'Log one more full fill-up and your MPG will show up. MPG is measured between two full fills (the full-to-full method), and any partial fills in between get added to the next full one.' }];
  const cmp = (groups, what) => {
    if (groups.length < 2) return;
    // Compare the best-performing fuel against the one you use most (falls back to the lowest).
    const hi = groups[0], common = [...groups].sort((a, b) => b.segs - a.segs || a.mpg - b.mpg)[0];
    const lo = common !== hi ? common : groups[groups.length - 1], d = hi.mpg - lo.mpg;
    if (d < 0.3) { out.push({ t: `MPG is about the same across ${what}. ${hi.label} and ${lo.label} are within ${fmt(d, 1)} MPG of each other.` }); return; }
    let t = `${hi.label} fills average ${fmt(d, 1)} MPG (${fmt(d / lo.mpg * 100, 0)}%) better than ${lo.label}: ${fmt(hi.mpg, 1)} vs ${fmt(lo.mpg, 1)} MPG over ${plural(hi.segs, 'tank')} and ${plural(lo.segs, 'tank')}.`;
    if (hi.cpm && lo.cpm) t += hi.cpm > lo.cpm ? ` ${lo.label} still costs less per mile, though (${c3(lo.cpm)} vs ${c3(hi.cpm)}).` : ` It also costs less per mile (${c3(hi.cpm)} vs ${c3(lo.cpm)}).`;
    if (hi.segs < 2 || lo.segs < 2) t += ' Early read: log a few more tanks of each to confirm.';
    const others = groups.filter(g => g !== hi && g !== lo);
    if (others.length) t += ` Also tracked: ${others.map(g => `${g.label} ${fmt(g.mpg, 1)}`).join(', ')} MPG.`;
    out.push({ t, kind: 'good' });
  };
  cmp(s.byEth, 'ethanol blends');
  cmp(s.byOct, 'octane grades');
  if (s.segs.length >= 5) {
    const last = s.segs.slice(-3), rest = s.segs.slice(0, -3);
    const lm = sum(last, 'miles') / sum(last, 'gal'), rm = sum(rest, 'miles') / sum(rest, 'gal'), d = lm - rm;
    if (Math.abs(d / rm) >= 0.04) out.push(d < 0
      ? { t: `Your last 3 tanks averaged ${fmt(lm, 1)} MPG, ${fmt(-d, 1)} below your earlier ${fmt(rm, 1)}. Check your tire pressure. Weather, idling, and city driving can also pull MPG down.`, kind: 'warn' }
      : { t: `Your last 3 tanks averaged ${fmt(lm, 1)} MPG, up ${fmt(d, 1)} from your earlier ${fmt(rm, 1)}. Nice work.`, kind: 'good' });
    else out.push({ t: `Your MPG is holding steady. Your last 3 tanks (${fmt(lm, 1)} MPG) match your earlier average.` });
  }
  if (s.best && s.segs.length >= 3) out.push({ t: `Your best tank was ${fmt(s.best.mpg, 1)} MPG on ${ethLabel(s.best.from)} ${octLabel(s.best.from)} octane${s.best.from.station ? ' from ' + s.best.from.station : ''}, ending ${fdate(s.best.to.date)}. Your worst was ${fmt(s.worst.mpg, 1)} MPG.` });
  const octCount = {}; s.fills.forEach(e => { const o = octVal(e); if (o != null) octCount[o] = (octCount[o] || 0) + 1; });
  const mainOct = Object.entries(octCount).sort((a, b) => b[1] - a[1])[0]?.[0];
  if (mainOct) {
    const st = new Map();
    s.fills.filter(e => String(octVal(e)) === mainOct && e.station).forEach(e => { const k = e.station.trim(); const g = st.get(k) || { k, gal: 0, cost: 0, n: 0 }; g.gal += num(e.gallons) || 0; g.cost += (num(e.gallons) || 0) * (num(e.price) || 0); g.n++; st.set(k, g); });
    const arr = [...st.values()].filter(g => g.gal > 0).map(g => ({ ...g, p: g.cost / g.gal })).sort((a, b) => a.p - b.p);
    if (arr.length >= 2 && arr[arr.length - 1].p - arr[0].p >= 0.02) {
      const lo = arr[0], hi = arr[arr.length - 1];
      out.push({ t: `For ${mainOct} octane, ${lo.k} has been your cheapest station at ${c3(lo.p)}/gal on average. That’s ${fmt((hi.p - lo.p) * 100, 0)}¢ less than ${hi.k} (${c3(hi.p)}).`, kind: 'good' });
    }
  }
  if (s.totalSaved > 0) out.push({ t: `Rewards and discounts have saved you ${money(s.totalSaved)}, bringing your effective price down to ${c3(s.effPrice)}/gal from ${c3(s.avgPrice)} at the pump.${s.points ? ` You’ve also earned ${fmt(s.points)} points.` : ''}`, kind: 'good' });
  else if (s.points) out.push({ t: `You’ve earned ${fmt(s.points)} rewards points so far.` });
  if (s.byProgram.length) {
    const top = s.byProgram[0];
    if (top.saved > 0) out.push({ t: `${top.label} is your most valuable program: ${money(top.saved)} saved over ${plural(top.fills, 'fill-up')}${top.points ? ` plus ${fmt(top.points)} points` : ''}.${s.byProgram.length > 1 ? ` Next is ${s.byProgram[1].label} (${money(s.byProgram[1].saved)}).` : ''}`, kind: 'good' });
  }
  if (s.milesPerDay && s.segs.length) {
    const perTank = (s.segMiles / s.segs.length) / s.milesPerDay;
    const next = addDays(s.fills[s.fills.length - 1].date, perTank);
    const monthly = s.spanDays > 0 ? (s.totalSpent - fillTotal(s.fills[s.fills.length - 1])) / s.spanDays * 30.44 : null;
    const when = next >= todayISO() ? `so your next fill-up will probably be around ${fdate(next)}` : `so at your usual pace you’re probably due for a fill-up now (or one went unlogged)`;
    out.push({ t: `You drive about ${fmt(s.milesPerDay)} miles a day and fill up about every ${fmt(perTank)} days, ${when}.${monthly ? ` That’s roughly ${money(monthly, 0)} a month on fuel.` : ''}` });
  }
  if (v.epa && num(v.epa.comb) && s.avgMpg) {
    const c = num(v.epa.comb), ci = num(v.epa.city), hw = num(v.epa.hwy), d = s.avgMpg - c, pct = d / c * 100;
    let where = '';
    if (hw && s.avgMpg >= hw) where = ' That’s at or above even the highway rating, so it looks like mostly steady highway driving.';
    else if (ci && s.avgMpg < ci) where = ' That’s below the city rating. Short trips, idling, cold weather, or heavy loads can cause this, and so can low tire pressure.';
    else if (ci && hw) where = ` That falls between the city (${ci}) and highway (${hw}) ratings, so you’re doing a mix of both.`;
    out.splice(Math.min(1, out.length), 0, { t: `Your ${fmt(s.avgMpg, 1)} MPG average is ${Math.abs(pct) < 1 ? 'right on' : `${fmt(Math.abs(pct), 0)}% ${d > 0 ? 'above' : 'below'}`} the EPA combined rating of ${c} MPG.${where}`, kind: Math.abs(pct) < 5 || d > 0 ? 'good' : 'warn' });
  }
  const minO = num(v.specs?.minOctane);
  if (minO) { const lowFills = s.fills.filter(e => octVal(e) != null && octVal(e) < minO); if (lowFills.length) out.push({ t: `${plural(lowFills.length, 'fill-up')} used fuel below the ${minO} octane in your specs${/required/i.test(v.specs.fuelGrade || '') ? ', which your manual lists as required' : ''}. Using a lower grade than recommended can reduce power and MPG.`, kind: 'warn' }); }
  if (s.partialsUsed) out.push({ t: `${plural(s.partialsUsed, 'partial fill')} ${s.partialsUsed === 1 ? 'was' : 'were'} added into the full-to-full MPG math, so no fuel goes uncounted.` });
  if (s.restarts) out.push({ t: `${plural(s.restarts, 'fill')} marked “missed a fill” restarted MPG tracking, so one gap won’t throw off your averages.`, kind: 'warn' });
  return out;
}

/* ---------- maintenance status ---------- */
const RANK = { none: 0, ok: 1, soon: 2, over: 3 };
const LBL = { none: 'No records', ok: 'OK', soon: 'Due soon', over: 'Overdue' };
const worse = (a, b) => RANK[b] > RANK[a] ? b : a;
function intervalStatus(a, v) {
  const odo = curOdo(v), im = num(a.intMiles), imo = num(a.intMonths);
  const dueOdo = im && num(a.odo) != null ? num(a.odo) + im : null;
  const dueDate = imo && a.date ? addMonths(a.date, imo) : null;
  const um = UM(v), h = isHrs(v);
  if (!dueOdo && !dueDate) return { level: 'ok', label: 'Logged', text: `Last done ${fdate(a.date)}${num(a.odo) != null ? ` at ${fmtO(num(a.odo), v)} ${um}` : ''}` };
  let level = 'ok'; const left = [];
  if (dueOdo != null) { const m = dueOdo - odo; if (m <= 0) level = 'over'; else if (m <= Math.max(h ? 5 : 500, im * 0.1)) level = worse(level, 'soon'); left.push(m <= 0 ? `${fmtO(-m, v)} ${um} overdue` : `${fmtO(m, v)} ${um} left`); }
  if (dueDate) { const d = daysBetween(todayISO(), dueDate); if (d <= 0) level = 'over'; else if (d <= 30) level = worse(level, 'soon'); left.push(d <= 0 ? `${plural(-d, 'day')} overdue` : d < 60 ? `${plural(d, 'day')} left` : `${fmt(d / 30.44)} mo left`); }
  const due = [dueOdo != null && `${fmtO(dueOdo, v)} ${um}`, dueDate && fdate(dueDate)].filter(Boolean).join(' or ');
  return { level, label: LBL[level], text: `Due at ${due} · ${left.join(', ')}`, dueOdo, dueDate };
}
const tireSet = v => entries(v, 'tires').find(e => has(e.services, 'New tires')) || null;
const batteryCur = v => entries(v, 'battery').find(e => has(e.events, 'New battery')) || null;
const wExp = b => b && num(b.warranty) ? addMonths(b.date, num(b.warranty)) : null;
function sectionStatus(sec, v) {
  const list = entries(v, sec.id);
  if (!list.length) return { level: 'none', label: LBL.none, text: `No ${sec.noun} logged yet` };
  if (sec.id === 'brakes') {
    let level = 'ok'; const parts = [];
    for (const ax of ['Front', 'Rear']) {
      const a = list.find(e => e.axle === ax || e.axle === 'Both'); if (!a) continue;
      const st = intervalStatus(a, v); level = worse(level, st.level);
      const t = list.find(e => (e.axle === ax || e.axle === 'Both') && num(e.thickness) != null);
      let thick = '';
      if (t) { const th = num(t.thickness); thick = ` · pads ${th} mm`; if (th <= 3) level = worse(level, 'over'); else if (th <= 4) level = worse(level, 'soon'); }
      parts.push(`${ax}: ${st.text.replace(/^Due at /, 'inspect by ')}${thick}`);
    }
    return { level, label: LBL[level], text: parts.join(' — ') };
  }
  if (sec.id === 'battery') return batteryStatus(v, list);
  const a = sec.anchor ? sec.anchor(list) : list[0];
  let st = a ? intervalStatus(a, v) : { level: 'ok', label: 'Logged', text: `Last entry ${fdate(list[0].date)}` };
  if (sec.id === 'tires') {
    const t = list.find(e => e.tread && TIRE_POS.some(([k]) => num(e.tread[k]) != null));
    if (t) {
      const mn = Math.min(...TIRE_POS.map(([k]) => num(t.tread[k])).filter(x => x != null));
      const lvl = mn <= 2 ? 'over' : mn <= 4 ? 'soon' : 'ok';
      st = { ...st, level: worse(st.level, lvl), text: `${st.text} · min tread ${mn}/32${mn <= 2 ? ' (replace)' : mn <= 4 ? ' (getting low)' : ''}` };
      st.label = LBL[st.level];
    }
    const pe = list.find(e => e.psi && TIRE_POS.some(([k]) => num(e.psi[k]) != null)), tg = psiTargets(v);
    if (pe && (tg.fl || tg.rl)) { const low = TIRE_POS.filter(([k]) => num(pe.psi[k]) != null && tg[k] && num(pe.psi[k]) < tg[k] - 1).map(([, l]) => l);
      if (low.length) { st = { ...st, level: worse(st.level, 'soon'), text: `${st.text} · ${low.join(', ')} below spec PSI (${fdateS(pe.date)})` }; st.label = LBL[st.level]; } }
    const set = tireSet(v);
    if (set && /^\d{4}$/.test((set.dot || '').trim())) { const yy = 2000 + Number(set.dot.trim().slice(2)); const age = new Date().getFullYear() - yy; if (age >= 6) { st.level = worse(st.level, 'soon'); st.label = LBL[st.level]; st.text += ` · tires ${age} yrs old`; } }
  }
  return st;
}
function batteryStatus(v, list) {
  const b = batteryCur(v); let level = 'ok', label = 'OK'; const parts = [];
  if (b) {
    const ageY = daysBetween(b.date, todayISO()) / 365.25; parts.push(`${fmt(ageY, 1)} yrs old`);
    const exp = wExp(b);
    if (exp) { const d = daysBetween(todayISO(), exp);
      if (d < 0) { level = 'soon'; label = 'Out of warranty'; parts.push(`warranty expired ${fdate(exp)}`); }
      else { if (d <= 60) { level = 'soon'; label = 'Warranty ending'; } parts.push(`warranty until ${fdate(exp)}`); } }
    if (ageY >= 5) { level = worse(level, 'soon'); if (label === 'OK') label = 'Aging'; }
  } else parts.push('Install not logged');
  const t = list.find(e => num(e.resting) != null);
  if (t) { const r = num(t.resting); parts.push(`${r} V resting (${fdateS(t.date)})`);
    if (r < 12.2) { level = 'over'; label = 'Weak battery'; } else if (r < 12.4) { level = worse(level, 'soon'); if (label === 'OK') label = 'Low voltage'; } }
  return { level, label, text: parts.join(' · ') };
}

/* ---------- UI helpers ---------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
const stat = (k, v, u = '') => `<div class="stat"><div class="k">${esc(k)}</div><div class="v">${v}${u ? `<small>${u}</small>` : ''}</div></div>`;
const pill = st => `<span class="pill ${st.level}">${esc(st.label)}</span>`;

function ask({ title, msg = '', buttons, typeToConfirm }) {
  return new Promise(res => {
    const d = $('#confirm'), box = $('#confirmInner');
    box.innerHTML = `<h3>${esc(title)}</h3><p>${msg}</p>${typeToConfirm ? `<label class="field"><span class="lbl">Type <b>${esc(typeToConfirm)}</b> to confirm</span><input id="typeConfirm" autocomplete="off" autocapitalize="characters"></label>` : ''}
      <div class="btns">${buttons.map((b, i) => `<button type="button" class="btn ${b.cls || ''}" data-i="${i}" ${typeToConfirm && b.needsType ? 'disabled' : ''}>${esc(b.label)}</button>`).join('')}</div>`;
    const done = val => { d.close(); res(val); };
    box.onclick = e => { const b = e.target.closest('button[data-i]'); if (b) done(buttons[b.dataset.i].value); };
    d.oncancel = e => { e.preventDefault(); done(null); };
    if (typeToConfirm) { const inp = $('#typeConfirm'); inp.oninput = () => $$('button[data-i]', box).forEach((b, i) => { if (buttons[i].needsType) b.disabled = inp.value.trim().toLowerCase() !== typeToConfirm.toLowerCase(); }); }
    d.showModal();
  });
}
const confirmDanger = (title, msg, label = 'Delete') => ask({ title, msg, buttons: [{ label, value: true, cls: 'danger' }, { label: 'Cancel', value: false }] });

/* ---------- forms ---------- */
function datalistFor(f, pool) {
  if (!f.list) return '';
  const opts = new Set(Array.isArray(f.list) ? f.list : []);
  if (f.list === 1 && pool) db.vehicles.forEach(x => pool(x).forEach(e => { if (e[f.k]) opts.add(String(e[f.k]).trim()); }));
  return `<datalist id="dl_${f.k}">${[...opts].slice(0, 40).map(o => `<option value="${esc(o)}">`).join('')}</datalist>`;
}
function fieldHTML(f, vals, pool) {
  if (f.t === 'h') return `<div class="fhead">${esc(f.l)}</div>`;
  if (f.t === 'hint') return `<div class="field hint" data-k="${f.k}">${esc(f.l)}</div>`;
  if (f.t === 'fit') return `<div class="field fitbox" data-k="${f.k}" data-fit="${f.cat}"></div>`;
  if (f.t === 'pick') return `<div class="field pick" data-k="${f.k}" data-cat="${f.cat}"><span class="lbl">${esc(f.l)}</span><input type="hidden" name="${f.k}" value="${esc(vals[f.k] ? (typeof vals[f.k] === 'string' ? vals[f.k] : JSON.stringify(vals[f.k])) : '')}"><div class="pick-ui"></div></div>`;
  const val = vals[f.k], name = `name="${f.k}"`, cls = `field${f.half ? ' half' : ''}`;
  const lbl = `<span class="lbl">${esc(f.l)}${f.req ? ' *' : ''}</span>`;
  const hint = f.hint ? `<small class="muted">${esc(f.hint)}</small>` : '';
  const ph = f.ph ? `placeholder="${esc(f.ph)}"` : '';
  let inner = '';
  switch (f.t) {
    case 'text': inner = `<input type="text" ${name} value="${esc(val)}" ${ph} ${f.list ? `list="dl_${f.k}"` : ''} autocomplete="off">${datalistFor(f, pool)}`; break;
    case 'num': {
      const inp = `<input type="number" inputmode="decimal" ${name} value="${esc(val)}" step="${f.step || 'any'}" ${ph}>`;
      inner = f.unit ? `<div class="unit">${inp}<em>${esc(f.unit)}</em></div>` : f.pre ? `<div class="unit pre">${inp}<em>${esc(f.pre)}</em></div>` : inp; break;
    }
    case 'date': inner = `<input type="date" ${name} value="${esc(val)}">`; break;

function trendChart(s) {
  const mp = s.segs.map(x => ({ t: parseD(x.to.date).getTime(), y: x.mpg }));
  const pr = s.fills.filter(e => num(e.price)).map(e => ({ t: parseD(e.date).getTime(), y: num(e.price) }));
  if (mp.length < 2 && pr.length < 2) return '<p class="muted" style="margin:0">Log a few more fill-ups to see trends.</p>';
  const W = 340, Ht = 180, L = 30, R = 42, T = 12, B = 24;
  const ts = [...mp, ...pr].map(p => p.t), t0 = Math.min(...ts), t1 = Math.max(...ts);
  const ext = a => { if (!a.length) return [0, 1]; const lo = Math.min(...a.map(p => p.y)), hi = Math.max(...a.map(p => p.y)); const p = (hi - lo) * 0.15 || 1; return [lo - p, hi + p]; };
  const [m0, m1] = ext(mp), [p0, p1] = ext(pr);
  const X = t => L + (t1 === t0 ? 0.5 : (t - t0) / (t1 - t0)) * (W - L - R);
  const Y = (y, a, b) => T + (1 - (y - a) / (b - a)) * (Ht - T - B);
  const path = (a, lo, hi) => a.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)},${Y(p.y, lo, hi).toFixed(1)}`).join('');
  let g = '';
  for (let i = 0; i <= 3; i++) {
    const y = T + i * (Ht - T - B) / 3; g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/>`;
    if (mp.length) g += `<text x="${L - 5}" y="${y + 3}" text-anchor="end">${fmt(m1 - i * (m1 - m0) / 3, 0)}</text>`;
    if (pr.length) g += `<text x="${W - R + 5}" y="${y + 3}">$${(p1 - i * (p1 - p0) / 3).toFixed(2)}</text>`;
  }
  [t0, (t0 + t1) / 2, t1].forEach((t, i) => { g += `<text x="${X(t)}" y="${Ht - 6}" text-anchor="${['start', 'middle', 'end'][i]}">${fdateS(iso(new Date(t)))}</text>`; });
  const dots = (a, lo, hi, c) => a.map(p => `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.y, lo, hi).toFixed(1)}" r="3.2" fill="${c}" stroke="var(--surface)" stroke-width="1.5"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="MPG and price per gallon over time">${g}
    ${pr.length > 1 ? `<path d="${path(pr, p0, p1)}" fill="none" stroke="var(--soon)" stroke-width="2" stroke-dasharray="4 3" opacity=".9"/>${dots(pr, p0, p1, 'var(--soon)')}` : ''}
    ${mp.length > 1 ? `<path d="${path(mp, m0, m1)}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round"/>${dots(mp, m0, m1, 'var(--accent)')}` : ''}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>MPG (left)</span><span><i style="background:var(--soon)"></i>Price/gal (right)</span></div>`;
}

const JOIN_URL = 'https://bigriznizzle.github.io/autolog/join/';
// Arrived from the invite page (?join=1): remember it for this visit and drop the param so a Home Screen icon gets the clean URL
(function () { try { if (/[?&]join(=[^&]*)?(&|$)/.test(location.search)) { sessionStorage.setItem('autolog:join', '1'); const q = location.search.slice(1).split('&').filter(x => x && !/^join(=|$)/.test(x)).join('&'); history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash); } } catch (e) { /* ignore */ } })();
const isStandalone = () => navigator.standalone === true || !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches);
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function joinCoach() {
  let on = false; try { on = sessionStorage.getItem('autolog:join') === '1'; } catch (e) { /* ignore */ }
  if (!on || isStandalone() || window.AUTOLOG_STANDALONE) return '';
  const ios = isIOS(), android = /Android/i.test(navigator.userAgent);
  const how = ios ? 'Tap <b>Share</b> (the square with the arrow; tap <b>•••</b> first if you don’t see it), then <b>Add to Home Screen</b>, then <b>Add</b>.'
    : android ? 'Tap Chrome’s <b>⋮</b> menu, then <b>Install app</b> (or <b>Add to Home screen</b>).' : 'Use your browser’s <b>Install</b> option in the address bar or menu, or just use it here.';
  return `<section class="card join-coach"><div class="card-head"><h3>📲 Almost there</h3><button type="button" class="btn small" data-act="joinDone" aria-label="Dismiss">✕</button></div>

async function shareApp() {
  const data = { title: 'AutoLog · RIZNOSS Chamber 01', text: 'AutoLog tracks fuel, maintenance and what your car really costs. Free, private, works offline.', url: JOIN_URL };
  if (navigator.share) { try { await navigator.share(data); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(JOIN_URL); toast('Invite link copied'); } catch (e) { prompt('Copy this link:', JOIN_URL); }
}
function showSplash() {
  try { if (sessionStorage.getItem('autolog:splash') || /[?&]nosplash\b/.test(location.search)) return; sessionStorage.setItem('autolog:splash', '1'); } catch (e) { return; }

/* ---------- rewards programs ---------- */
const PROG_FIELDS_CUSTOM = [
  { k: 'name', l: 'Program name', t: 'text', req: 1, ph: 'e.g. Local Co-op Rewards' },
  { k: 'brands', l: 'Stations / brands', t: 'text', half: 1 }, { k: 'type', l: 'Type', t: 'select', opts: ['Gas station', 'Grocery', 'Warehouse club', 'Membership / app', 'Cash-back app', 'Credit card', 'Other'], half: 1 },
  { k: 'url', l: 'Program website', t: 'text', ph: 'https://' },
  { k: 'benefitsText', l: 'Benefits (your notes)', t: 'textarea', ph: 'e.g. 5¢/gal every fill, 2× points on Tuesdays' },
];
const PROG_FIELDS = [
  { k: 'memberId', l: 'Member ID / phone / card #', t: 'text', hint: 'Optional. Stored only on this device.' },
  { k: 'cpg', l: 'Your usual discount', t: 'num', unit: '¢/gal', step: 0.1, half: 1, hint: 'Pre-fills the fill-up form when you pick this program.' },
  { k: 'notes', l: 'Notes', t: 'textarea', ph: 'Tier/status, linked cards, expiring rewards…' },
];
function programForm(libId, existing) {
  const lib = libId ? libById(libId) : progLib(existing);
  const custom = existing ? !existing.libId : !lib;
  const fields = custom ? [...PROG_FIELDS_CUSTOM, ...PROG_FIELDS] : PROG_FIELDS;
  const values = existing ? { ...existing } : { cpg: lib?.cpg ?? '' };
  openForm({ title: existing ? `Edit ${progName(existing)}` : `Add ${lib ? lib.name : 'custom program'}`, fields, values, saveLabel: existing ? 'Save' : 'Add program',
    onSave: vals => {
      if (vals.url && !/^https?:\/\//i.test(vals.url)) vals.url = 'https://' + vals.url;
      if (existing) Object.assign(existing, vals);
      else { const pr = { id: uid(), libId: lib ? lib.id : null, added: todayISO(), ...vals }; db.programs.push(pr); toast(`${progName(pr)} added`); setTimeout(() => { location.hash = `#/rewards/${pr.id}`; }, 0); }
    },
    onDelete: existing ? () => { db.programs = db.programs.filter(x => x !== existing); save(); setTimeout(() => { location.hash = '#/rewards'; }, 0); } : null });
  if (existing) { const del = $('#sheetForm [data-del]'); if (del) del.innerHTML = `${I.trash} Remove program`; }
}
function pickLibrary() {
  pickSheet('Add a rewards program', [{ title: 'Custom program', sub: 'Add a program that isn’t in the library', icon: I.plus, cls: 'c-fuel', run: () => programForm(null) },
    ...LIB.map(l => ({ title: l.name, sub: l.brands, icon: I.gift, cls: 'c-battery', right: db.programs.some(pr => pr.libId === l.id) ? '<span class="current-badge">Added</span>' : '', run: () => programForm(l.id) }))]);
}
const libSearchText = l => [l.name, l.brands, l.type, l.summary, ...(l.benefits || [])].join(' ').toLowerCase();
function viewRewards() {
  const mine = db.programs;
  return `<div class="page-title"><h2>Rewards</h2><button class="btn small primary" data-act="addProgram">${I.plus} Program</button></div>
    <section class="card"><div class="card-head"><h3>${I.gift} My programs</h3><span class="muted">${plural(mine.length, 'program')}</span></div>
      ${mine.length ? `<div class="status-list">${mine.map(pr => { const st = progStats(pr.id), lib = progLib(pr);
        return `<a class="srow" href="#/rewards/${pr.id}"><span class="sicon c-battery">${I.gift}</span><span class="sbody"><b>${esc(progName(pr))}</b><small>${esc([pr.memberId ? 'ID ' + pr.memberId : '', lib ? lib.brands : pr.brands].filter(Boolean).join(' · ') || 'Custom program')}</small></span><span class="e-side"><b>${money(st.saved)}</b><small>${plural(st.fills, 'fill')}</small></span></a>`; }).join('')}</div>`
        : `<div class="empty" style="padding:14px 6px">Add the programs you belong to. When you log a fill-up, pick the ones you used and your savings roll into your fuel stats.</div>`}
    </section>
    <section class="card"><div class="card-head"><h3>Program library</h3><span class="muted">${LIB.length} programs</span></div>
